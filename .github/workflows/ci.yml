name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  keycastd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev xkb-data
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --manifest-path keycastd/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path keycastd/Cargo.toml

  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js
