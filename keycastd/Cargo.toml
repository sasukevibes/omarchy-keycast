[package]
name = "keycastd"
version = "0.1.0"
edition = "2024"
description = "Input helper for keycast, the Omarchy keystroke overlay"
license = "MIT"
repository = "https://github.com/sasukevibes/omarchy-keycast"

[dependencies]
evdev = "0.13"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
xkbcommon = { version = "0.9.0", default-features = false }
